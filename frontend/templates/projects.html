{% extends "base.html" %}
{% block title %}Projects · TaskFlow{% endblock %}
{% block body %}
{% include "partials/navbar.html" %}
<main class="md:ml-60 pb-20 md:pb-10 px-4 md:px-8 pt-6 md:pt-8 max-w-6xl mx-auto">
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900">Projects</h1>
    <button onclick="openCreateProjectModal()" class="btn-primary text-sm px-4 py-2.5 flex items-center gap-1.5">
      <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      New Project
    </button>
  </div>

  <div class="flex gap-2 mb-4">
    <div class="relative flex-1">
      <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="search-input" type="search" placeholder="Search projects…" class="input-field pl-10">
    </div>
    <select id="status-filter-select" onchange="setFilter(this.value)" class="input-field flex-shrink-0" style="width: auto;">
      <option value="">All statuses</option>
      <option value="active">Active</option>
      <option value="completed">Completed</option>
      <option value="on_hold">On Hold</option>
    </select>
  </div>

  <div class="flex flex-wrap gap-2 mb-5">
    <button data-filter="" onclick="setFilter('')" class="text-xs font-medium px-3 py-1.5 rounded-full bg-brand-500 text-white transition-colors">All (<span id="count-all">0</span>)</button>
    <button data-filter="active" onclick="setFilter('active')" class="text-xs font-medium px-3 py-1.5 rounded-full bg-gray-100 text-gray-700 transition-colors">Active (<span id="count-active">0</span>)</button>
    <button data-filter="completed" onclick="setFilter('completed')" class="text-xs font-medium px-3 py-1.5 rounded-full bg-gray-100 text-gray-700 transition-colors">Completed (<span id="count-completed">0</span>)</button>
    <button data-filter="on_hold" onclick="setFilter('on_hold')" class="text-xs font-medium px-3 py-1.5 rounded-full bg-gray-100 text-gray-700 transition-colors">On Hold (<span id="count-on_hold">0</span>)</button>
  </div>

  <div id="projects-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</main>
{% include "partials/bottom_nav.html" %}

<!-- Create Project Modal -->
<div id="create-project-modal" class="hidden fixed inset-0 bg-black/40 flex items-end md:items-center justify-center z-50">
  <div class="bg-white rounded-t-2xl md:rounded-xl w-full md:max-w-md p-6">
    <h2 class="text-lg font-bold mb-4">New Project</h2>
    <form id="create-project-form" class="space-y-4">
      <input id="project-name" type="text" placeholder="Project name" class="input-field" required>
      <textarea id="project-description" placeholder="Description (optional)" class="input-field" rows="3"></textarea>
      <select id="project-status" class="input-field">
        <option value="active">Active</option>
        <option value="completed">Completed</option>
        <option value="on_hold">On Hold</option>
      </select>
      <div class="flex gap-3">
        <div class="flex-1">
          <label class="block text-xs font-medium text-gray-500 mb-1">Start date</label>
          <input id="project-start-date" type="date" class="input-field">
        </div>
        <div class="flex-1">
          <label class="block text-xs font-medium text-gray-500 mb-1">End date</label>
          <input id="project-end-date" type="date" class="input-field">
        </div>
      </div>
      <div class="flex gap-3">
        <button type="button" onclick="closeCreateProjectModal()" class="flex-1 py-3 rounded-lg border border-gray-300 text-gray-700">Cancel</button>
        <button type="submit" class="flex-1 btn-primary">Create</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Project Modal -->
<div id="edit-project-modal" class="hidden fixed inset-0 bg-black/40 flex items-end md:items-center justify-center z-50">
  <div class="bg-white rounded-t-2xl md:rounded-xl w-full md:max-w-md p-6">
    <h2 class="text-lg font-bold mb-4">Edit Project</h2>
    <form id="edit-project-form" class="space-y-4">
      <input type="hidden" id="edit-project-id">
      <input id="edit-project-name" type="text" placeholder="Project name" class="input-field" required>
      <textarea id="edit-project-description" placeholder="Description (optional)" class="input-field" rows="3"></textarea>
      <select id="edit-project-status" class="input-field">
        <option value="active">Active</option>
        <option value="completed">Completed</option>
        <option value="on_hold">On Hold</option>
      </select>
      <div class="flex gap-3">
        <div class="flex-1">
          <label class="block text-xs font-medium text-gray-500 mb-1">Start date</label>
          <input id="edit-project-start-date" type="date" class="input-field">
        </div>
        <div class="flex-1">
          <label class="block text-xs font-medium text-gray-500 mb-1">End date</label>
          <input id="edit-project-end-date" type="date" class="input-field">
        </div>
      </div>
      <div class="flex gap-3">
        <button type="button" onclick="closeEditProjectModal()" class="flex-1 py-3 rounded-lg border border-gray-300 text-gray-700">Cancel</button>
        <button type="submit" class="flex-1 btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/projects.js') }}"></script>
{% endblock %}
