# Optional: spin up a local MySQL instance + the backend together.
# Usage: docker compose up --build
version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflow
    ports:
      - "3306:3306"
    volumes:
      - taskflow_mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      FLASK_ENV: development
      SECRET_KEY: dev-secret-key
      JWT_SECRET_KEY: dev-jwt-secret-key
      DATABASE_URL: mysql+pymysql://taskflow:taskflow@db:3306/taskflow
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app

volumes:
  taskflow_mysql_data:
