{% extends "base.html" %}
{% block title %}Calendar · TaskFlow{% endblock %}
{% block body %}
{% include "partials/navbar.html" %}
<main class="md:ml-60 pb-20 md:pb-10 px-4 md:px-8 pt-6 md:pt-8 max-w-6xl mx-auto">
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900">Calendar</h1>
    <div class="flex items-center gap-2">
      <button onclick="changeMonth(-1)" class="w-9 h-9 rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 flex items-center justify-center">
        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span id="calendar-month-label" class="text-sm font-medium text-gray-800 w-32 text-center"></span>
      <button onclick="changeMonth(1)" class="w-9 h-9 rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 flex items-center justify-center">
        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="card mb-5">
    <div class="grid grid-cols-7 gap-1 mb-2 text-center">
      <div class="text-xs font-semibold text-gray-400 py-1">Sun</div>
      <div class="text-xs font-semibold text-gray-400 py-1">Mon</div>
      <div class="text-xs font-semibold text-gray-400 py-1">Tue</div>
      <div class="text-xs font-semibold text-gray-400 py-1">Wed</div>
      <div class="text-xs font-semibold text-gray-400 py-1">Thu</div>
      <div class="text-xs font-semibold text-gray-400 py-1">Fri</div>
      <div class="text-xs font-semibold text-gray-400 py-1">Sat</div>
    </div>
    <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
  </div>

  <div class="card">
    <h2 id="selected-day-heading" class="font-semibold text-gray-900 mb-3">Select a day</h2>
    <ul id="selected-day-tasks" class="divide-y divide-gray-100"></ul>
  </div>
</main>
{% include "partials/bottom_nav.html" %}
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
