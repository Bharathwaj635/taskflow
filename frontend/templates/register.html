{% extends "base.html" %}
{% block title %}Sign Up · TaskFlow{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 py-10 bg-gradient-to-br from-sky-200 via-indigo-100 to-indigo-300">
  <div class="w-full max-w-3xl rounded-[48px] bg-gradient-to-br from-slate-800 via-slate-900 to-black shadow-2xl p-3 md:p-4">

    <!-- Brand name, sits in the navy frame above both cards -->
    <div class="text-center pt-3 pb-4 md:pt-4 md:pb-5">
      <span class="inline-block text-2xl md:text-3xl font-extrabold tracking-wide bg-gradient-to-r from-blue-300 via-white to-blue-300 bg-clip-text text-transparent bg-[length:200%_auto] animate-shine">
        TaskFlow
      </span>
    </div>

  <div class="flex flex-col md:flex-row items-stretch gap-4">

    <!-- Left: form card (wrapped for the revolving blue-line border effect) -->
    <div class="relative w-full md:w-1/2 rounded-3xl p-[2px] overflow-hidden shadow-xl">
      <div class="absolute inset-0 animate-border-spin"
           style="background: conic-gradient(from 0deg, transparent 0deg, transparent 335deg, #93c5fd 350deg, #2563eb 358deg, transparent 360deg);"></div>
      <div class="relative w-full h-full bg-gradient-to-br from-white via-blue-50 to-indigo-100 rounded-[22px] p-8 md:p-10 flex flex-col transition-all duration-300 ease-out hover:shadow-2xl hover:-translate-y-1 hover:scale-[1.015] active:scale-[0.99]">
      <h1 class="text-2xl font-bold text-indigo-700 mb-1">Sign Up</h1>
      <p class="text-sm text-gray-500 mb-8">Create your TaskFlow account</p>

      <form id="register-form" class="space-y-6 flex-1">
        <div class="relative">
          <input type="text" id="name" placeholder="Full Name"
                 class="w-full bg-transparent border-0 border-b border-gray-300 focus:border-indigo-500 focus:outline-none py-2 pr-8 text-sm text-gray-800 placeholder-gray-500 transition-colors"
                 required autocomplete="name">
          <span class="absolute right-0 bottom-2.5 text-gray-400 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
        </div>

        <div class="relative">
          <input type="text" id="username" placeholder="Username"
                 class="w-full bg-transparent border-0 border-b border-gray-300 focus:border-indigo-500 focus:outline-none py-2 pr-8 text-sm text-gray-800 placeholder-gray-500 transition-colors"
                 required minlength="3" autocomplete="username">
          <span class="absolute right-0 bottom-2.5 text-gray-400 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6"/>
            </svg>
          </span>
        </div>

        <div class="relative">
          <input type="email" id="email" placeholder="Email"
                 class="w-full bg-transparent border-0 border-b border-gray-300 focus:border-indigo-500 focus:outline-none py-2 pr-8 text-sm text-gray-800 placeholder-gray-500 transition-colors"
                 required autocomplete="email">
          <span class="absolute right-0 bottom-2.5 text-gray-400 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3 7l9 6 9-6"/>
            </svg>
          </span>
        </div>

        <div class="relative">
          <input type="password" id="password" placeholder="Password (min 6 characters)"
                 class="w-full bg-transparent border-0 border-b border-gray-300 focus:border-indigo-500 focus:outline-none py-2 pr-8 text-sm text-gray-800 placeholder-gray-500 transition-colors"
                 required minlength="6" autocomplete="new-password">
          <button type="button" data-toggle-password="password"
                  aria-label="Show or hide password"
                  class="absolute right-0 bottom-2 p-0 bg-transparent border-none leading-none text-gray-400 hover:text-indigo-600 transition-colors focus:outline-none">
            <svg class="eye-icon-open w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.036 12.322a1.012 1.012 0 0 1 0-.644C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/>
              <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
            </svg>
            <svg class="eye-icon-closed w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/>
            </svg>
          </button>
        </div>

        <button type="submit"
                class="w-full rounded-full bg-gradient-to-r from-indigo-500 via-indigo-600 to-indigo-800 text-white font-semibold py-3 shadow-lg hover:opacity-95 active:opacity-90 transition-opacity">
          Sign Up
        </button>
      </form>

      <p id="error-msg" class="text-red-500 text-sm mt-3 text-center hidden"></p>

      <p class="text-sm text-gray-500 text-center mt-6">
        Already have an account? <a href="/login" class="text-indigo-600 font-medium">Log in</a>
      </p>
      </div>
    </div>

    <!-- Right: decorative panel -->
    <div class="hidden md:block md:w-1/2 relative rounded-[40px] shadow-2xl overflow-hidden bg-gradient-to-b from-slate-800 via-slate-900 to-black transition-all duration-300 ease-out hover:shadow-2xl hover:-translate-y-1 hover:scale-[1.015] hover:brightness-110 active:scale-[0.99]">
      <video
        class="absolute inset-0 w-full h-full object-cover opacity-80"
        data-loop-seconds="10"
        autoplay muted loop playsinline preload="auto"
        poster="{{ url_for('static', filename='img/panel-poster.jpg') }}">
        <source src="{{ url_for('static', filename='video/panel-loop.webm') }}" type="video/webm">
        <source src="{{ url_for('static', filename='video/panel-loop.mp4') }}" type="video/mp4">
      </video>
      <!-- styled border frame, sits above the video -->
      <div class="absolute inset-0 rounded-[40px] ring-1 ring-inset ring-white/15 pointer-events-none"></div>
      <!-- ambient glow, kept above the video for brand consistency -->
      <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 w-72 h-32 bg-amber-400/25 blur-3xl rounded-full pointer-events-none"></div>
    </div>

  </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/media.js') }}"></script>
{% endblock %}
