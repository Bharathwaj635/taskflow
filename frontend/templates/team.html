{% extends "base.html" %}
{% block title %}Team · TaskFlow{% endblock %}
{% block body %}
{% include "partials/navbar.html" %}
<main class="md:ml-60 pb-20 md:pb-10 px-4 md:px-8 pt-6 md:pt-8 max-w-6xl mx-auto">
  <div class="flex items-center justify-between mb-5">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-gray-900">Team</h1>
      <p class="text-sm text-gray-500 mt-0.5">Everyone who's a member of one of your projects.</p>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-3 mb-4">
    <select id="role-filter" onchange="applyTeamFilters()" class="input-field !py-2 !w-auto text-sm">
      <option value="">All roles</option>
      <option value="owner">Head</option>
      <option value="member">Member</option>
    </select>
    <label class="flex items-center gap-1.5 text-sm text-gray-600" style="cursor: pointer;">
      <input id="only-me-filter" type="checkbox" onchange="applyTeamFilters()" class="border-gray-300 text-brand-600" style="border-radius: 3px;">
      Just me
    </label>
  </div>

  <div id="team-list" class="card divide-y divide-gray-100 !p-0"></div>
</main>
{% include "partials/bottom_nav.html" %}
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/team.js') }}"></script>
{% endblock %}
